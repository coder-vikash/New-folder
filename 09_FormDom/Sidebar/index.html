<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    .sidebar {
      height: 100%;
      width: 10rem;
      background-color: red;
      left: 0;
      top: 0;
      position: fixed;
      transform: translateX(-100%);
      transition: all ease 0.3s;
    }
    nav {
      display: flex;
      align-items: center;
      justify-content: right;
      font-size: 30px;
    }
    button {
      font-size: 30px;
      padding: 10px;
      cursor: pointer;
    }
    .showsidebar {
      transform: translateX(0%);
    }
  </style>
  <body>
    <nav>This is the sidebar<button>Click me</button></nav>
    <div class="sidebar showsidebar">sidebar</div>
    <script src="script.js"></script>
  </body>
</html>
